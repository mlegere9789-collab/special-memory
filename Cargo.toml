[workspace]
resolver = "2"
members = ["crates/core-math", "crates/sim-state", "crates/battle-rules", "crates/acoustics-model", "shells/sim-cli", "shells/viewer-web", "shells/perf-kit", "crates/battle-ai", "crates/history-cal", "crates/terrain", "shells/terrain-cli", "crates/ui-model"]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
