[workspace]
resolver = "2"
members = ["crates/core-math", "crates/sim-state", "crates/battle-rules", "shells/sim-cli", "shells/viewer-web", "shells/perf-kit"]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
