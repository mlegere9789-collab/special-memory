high = 28063
note = "Union 23,049 and Confederate 28,063 are the sums of their components (control); the older Confederate figure is about 23,000 and page 84 gives 23,000 to 28,000."
claims = [
  { document = "CWV", page = 79, figure = 28063, tag = "untagged" },
  { document = "CWV", page = 79, figure = 23000, tag = "untagged" },
  { document = "CWV", page = 84, figure = 23000, figure_high = 28000, tag = "untagged" },
]
sums = [
  { parts = [3155, 14529, 5365], total = 23049, agrees = true },
  { parts = [3903, 18735, 5425], total = 28063, agrees = true },
]

