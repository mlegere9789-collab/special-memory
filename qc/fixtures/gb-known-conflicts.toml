# Known conflicts in the research volume (SPEC-013 section 9, rule GB17). Every row is a regression fixture:
# once the named record exists, the state described here must hold. Claims are untagged (CWV page given);
# a claim may carry its own `record` and `path`, otherwise it belongs to the row's. Paths use `/`; a segment
# on a list is an index or, for casualties, a scope name. Figures and stamps are integers and local-clock
# strings; a derived figure says so in `note`.
#
# kind: headline (never verified), range (disagreeing claims: not verified, range spans them), time (as range,
# with early and late), sum_conflict (components and headline disagree: flagged, both kept as claims),
# pair (the listed paths are kept together), control (sums and percentages that must hold), roster (one
# brigade record per designation, no two simultaneous command stints), stint (a person's stint ends by a
# stamp), onset (onset claims kept, never verified).
# Optional fields: low, high, early, late (the bounds of the row's own claims), not_before, keep, members,
# sums {parts, total, agrees}, rates {loss, base, pct}, counts {what, stated, listed}, person, ends_by.

[[conflict]]
id = "C01"
kind = "headline"
record = "us_army_potomac"
path = "strength/engaged"
rule = "GB17"
note = "Engaged 93,921 Union and 71,699 Confederate cited to ABT; older tallies differ. The army figure is never verified and the report holds the audited sum beside the headline."
claims = [
  { document = "CWV", page = 79, figure = 93921, tag = "untagged" },
  { document = "CWV", page = 79, figure = 71699, tag = "untagged", record = "cs_army_northern_virginia" },
]

