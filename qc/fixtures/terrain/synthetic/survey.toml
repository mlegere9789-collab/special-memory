# Synthetic one-tile survey for the terrain compiler tests: not historical data.
# The elevation files are generated by the tests (post (i, j) = 5 i + 3 j centimetres, source 1).
schema = "survey/1"
origin_easting_mm = 300000000
origin_northing_mm = 4400000000
crs = "synthetic local frame"
tiles_x = 1
tiles_y = 1
width_posts = 513
height_posts = 513

[[slab]]
id = "synthetic_slab"
x0 = 0
y0 = 0
x1 = 0
y1 = 0
