# SPEC-011 section 7: conflict fixtures CF-01 to CF-10. Each row names a disagreement in the record
# and the rule the committed tables must obey; `history_cal::check_conflicts` runs them.
# Rules: `envelope` (band `ref` covers every value; `rate_ref` with `rate_base` also checks that the
# rate of `value_b` lies in that band), `time_window` (trigger `ref`, window early_s or at_s to late_s or
# at_s, covers every value), `no_subtract` (band `ref` edges are not a difference of two values),
# `bad_value` (each value is in qc/fixtures/audit-known-errors.toml and any band edge or stated
# figure equal to one lies in an unverified row), `record_range` (the named history range holds both
# values as its low and high), `window_only` (value_a is strictly before value_b: a window, not a point).
# Values are counts or clock seconds; `value_c` and `value_d` extend a row to four values.
schema = "history-conflicts/1"

[[conflict]]
id = "CF-01"
subject = "Confederate battle total: 28,063 against about 23,000"
rule = "envelope"
ref = "HB-08"
value_a = 28063
value_b = 23000
confidence = "unverified"
sources = [{ document = "CWV", page = 79, tag = "untagged" }, { document = "CWV", page = 84, tag = "untagged" }]

