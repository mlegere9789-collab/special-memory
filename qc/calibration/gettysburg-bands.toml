# SPEC-011 section 7: the Gettysburg bands HB-01 to HB-24. Every `low` and `high` is widened from the
# stated figure by the rule named in `phrase` (policy.toml, CT-011-1101); `tools/validators/history_cal.py`
# and `history_cal::check_bands` recompute them. Phrase grammar: `exact`, `about`, `about_open`
# (top left open, other estimates higher), `nearly` and `over` take `source_value`; `range A B` and
# `range_open A` carry their own figures. Rate rows are permille (`source_value` is the permille figure).
# Windows are clock seconds (day N is (N-1)*86400 to N*86400). Rows of `total` basis wait for `capture`
# and then gate on their upper edge only. Unit `any` stands for every regiment of the scenario.
# A band changes only through an amendment that cites a page; simulation output never sets an edge.
schema = "history-bands/1"

