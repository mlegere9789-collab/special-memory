to_s = 86400
low = 7650
high = 9000
phrase = "nearly"
source_value = 9000
needs = "capture"
confidence = "partial"
sources = [{ document = "CWV", page = 69, tag = "V" }, { document = "CWV", page = 80, tag = "untagged" }]
note = "Union day-1 loss, nearly 9,000."

