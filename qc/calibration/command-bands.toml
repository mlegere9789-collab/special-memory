# SPEC-007 section 10: the command bands (family "command"), CT-007-1, CT-007-2, CT-007-3,
# CT-007-6 and CT-007-7. Integer-only: every `low`/`high` is the real number times the band's
# `scale`. Times are milli-minutes (1200 ticks to the minute), friction is per 100 legs, shares
# and confidences are fractions. `weapon` names the variant (a medium, or the officer of
# `cemetery_hill`); `at_mm` the distance. A band changes only through a SPEC-007 amendment that
# cites evidence; simulation output never sets a limit.
schema = "bands/1"

[[band]]
id = "C1"
family = "command"
metric = "delivery"
weapon = "courier"
scale = 1000
points = [{ at_mm = 3000000, low = 8000, high = 40000 }]
confidence = "unverified"
placeholder = true
calibration_target = "CT-007-1"
note = "A 3 km courier leg takes 8 to 40 minutes."

[[band]]
id = "C2"
family = "command"
metric = "relay_delivery"
weapon = "courier"
scale = 1000
points = [{ at_mm = 3000000, high = 70000 }]
confidence = "partial"
placeholder = true
calibration_target = "CT-007-1"
note = "A two-hop courier relay of 3 km legs takes at most 70 minutes (Howard heard of Reynolds's fall about 11:30, I Corps having arrived about 10:20, CWV p080)."

