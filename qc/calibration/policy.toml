# SPEC-011 section 9: every threshold of the historical calibration as a placeholder row.
# Values are set by source review or playtest review, never by simulation output.
schema = "calibration-policy/1"

[[threshold]]
id = "widen_exact_pm"
value = 150
confidence = "unverified"
placeholder = true
calibration_target = "CT-011-1101"
note = "Widening of an exact stated count, either side."

[[threshold]]
id = "widen_approx_pm"
value = 200
confidence = "unverified"
placeholder = true
calibration_target = "CT-011-1101"
note = "Widening of an 'about' figure, either side."

[[threshold]]
id = "approx_time_s"
value = 900
confidence = "unverified"
placeholder = true
calibration_target = "CT-011-1101"
