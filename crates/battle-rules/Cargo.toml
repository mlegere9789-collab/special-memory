[package]
name = "battle-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Battle rules: movement, drill and formations, weapons and fire (SPEC-004, SPEC-005)"

[lints]
workspace = true

[dependencies]
core-math = { path = "../core-math" }
sim-state = { path = "../sim-state" }
# Exact pins: rules data are parsed only by the loader (ADR 0004).
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
toml = { version = "=1.2.0", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
proptest = "1"
