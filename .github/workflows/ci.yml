name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: gates (scan, lint, data)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: forbidden terms (G4)
        run: python3 tools/scan_forbidden.py
      - name: no process text
        run: python3 tools/lint_process_text.py
      - name: historical data validation
        run: python3 tools/validate_data.py
      - name: registry consistency (TR-03)
        run: python3 tools/check_registry.py
      - name: validator self-tests
        run: python3 tools/test_validate_data.py && python3 tools/test_check_registry.py
      - name: Gettysburg audit self-tests
        run: python3 tools/test_gb_audit.py
      - name: wave-2 tool self-tests
        run: |
          python3 tools/test_gb_corpus.py
          python3 tools/test_gb_ladder.py
          python3 tools/test_gb_chain.py
          python3 tools/test_gb_time.py
          python3 tools/test_gb_reports.py
          python3 tools/test_survey.py
          python3 qc/fixtures/terrain/test_schemas.py
          python3 tools/test_environment_validator.py
          python3 tools/test_ingest_dem.py
          python3 tools/test_check_assets.py
          python3 tools/test_extract_traits.py
          python3 tools/test_command_validator.py
          python3 tools/test_history_cal.py
          python3 qc/perf/test_perf.py

  rust:
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install 1.97.0 --profile minimal -c rustfmt -c clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: hd-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release

  determinism:
    name: determinism (${{ matrix.os }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - run: cargo test --workspace --locked --release
      - name: verify golden replays (cross-platform proof)
        run: bash tools/verify_goldens.sh

  supply:
    name: supply (deny, licence ledger, sbom)
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_CYCLONEDX_VERSION: "0.5.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: cache supply tools
        id: supply-tools
        uses: actions/cache@v4
        with:
          path: ~/supply-tools
          key: supply-tools-${{ runner.os }}-deny-${{ env.CARGO_DENY_VERSION }}-cyclonedx-${{ env.CARGO_CYCLONEDX_VERSION }}
      - name: install cargo-deny and cargo-cyclonedx (pinned)
        if: steps.supply-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version "$CARGO_DENY_VERSION" --root ~/supply-tools cargo-deny
          cargo install --locked --version "$CARGO_CYCLONEDX_VERSION" --root ~/supply-tools cargo-cyclonedx
      - name: tools on PATH
        run: echo "$HOME/supply-tools/bin" >> "$GITHUB_PATH"
      - name: cargo-deny (advisories, licences, bans, sources)
        run: cargo deny --locked check
      - name: licence ledger is current
        run: python3 tools/licence_ledger.py --check
      - name: SBOM (CycloneDX)
        run: cargo cyclonedx --format json --spec-version 1.5 --override-filename sbom
      - name: collect SBOM files
        run: |
          mkdir -p sbom-out
          find . -path ./target -prune -o -name 'sbom.json' -print | while read -r f; do
            cp "$f" "sbom-out/$(echo "${f#./}" | tr '/' '_')"
          done
          ls sbom-out
      - name: upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-out/
          if-no-files-found: error

  visual:
    name: visual QC (wasm viewer, headless browser; not blocking yet)
    runs-on: ubuntu-24.04
    # Goldens were made in one container's Chromium. Remove continue-on-error after the first green run on this runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: toolchain and wasm target
        run: rustup toolchain install 1.97.0 --profile minimal && rustup target add wasm32-unknown-unknown --toolchain 1.97.0
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen*
          key: wasm-bindgen-cli-0.2.130-${{ runner.os }}
      - name: wasm-bindgen CLI (must match the pinned crate)
        run: command -v wasm-bindgen >/dev/null || cargo install wasm-bindgen-cli --version =0.2.130 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: bash tools/build_viewer_web.sh
      - run: node tools/visual_qc.mjs
