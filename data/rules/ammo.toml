# Ammunition rows (SPEC-005 section 1). Integer units: g, mm, mm/s, permille (_pm), ppm.
# A row that is a placeholder names its calibration target; sourced numbers cite the research page and its own tag.
schema = "ammo/1"

[constants]
air_density_g_m3 = 1225
iron_density_kg_m3 = 7200
gravity_um_s2 = 9806650
confidence = "unverified"
placeholder = true
calibration_target = "CT-005-2"
note = "air 1.225 kg/m3 at sea level, iron 7.2 g/cm3, standard gravity 9.80665 m/s2"

