# Drill table (SPEC-004 section 6). Units: ticks (_ticks), millimetres (_mm), permille (_pm).
# Qualitative basis: units were wildly uneven in training (CWV p030 section 1.3) and a
# well-trained regiment changed formation faster (CWV p511 section 4.5). Every number below is
# a placeholder awaiting calibration target CT-5.

[globals]
closeup_interval_ticks = 40
settle_tol_mm = 1000
settle_budget_ticks = 600
confidence = "unverified"
placeholder = true
calibration_target = "CT-5"
note = "Close-up cadence and settle tolerances; set by playtest review."

[[training]]
