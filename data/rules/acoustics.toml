# Acoustics data (SPEC-012 section 3). Integer units: mm, mm/s, centibel (_cdb, 0.01 dB), tenth of a degree C (_dc),
# millikelvin per metre (_mk_per_m), hertz (_hz), permille (_pm), ppm. Every number but the sound-speed law is a placeholder.
schema = "acoustics/1"

# Linear sound-speed law c = c0 + c_per_k * T: 343420 mm/s at 20 C against 343 m/s in the research volume.
[globals.air]
c0_mm_s = 331300
c_per_k_mm_s = 606
confidence = "partial"
sources = [{ document = "CWV", page = 457, note = "343 m/s; the linear law gives 343420 mm/s at 20 C" }]

[globals.propagation]
shear_ppm = 70000
g_min = 5
shadow_sat_g = 300
duct_loss_cdb_per_km = 100
barrier_cap_cdb = 2400
profile_step_mm = 20000
max_samples = 64
max_range_mm = 100000000
confidence = "unverified"
placeholder = true
calibration_target = "CT-012-2"

[globals.listening]
cluster_cell_mm = 100000
hyst_cdb = 300
drop_below_cdb = -1000
class_faint_cdb = 0
class_clear_cdb = 1000
class_loud_cdb = 3000
camera_window_ticks = 4
hq_window_ticks = 20
confidence = "unverified"
placeholder = true
calibration_target = "CT-012-5"

