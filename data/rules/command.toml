# Command friction table (SPEC-007 section 3). Units: ticks (_ticks), millimetres (_mm, _mm_s), permille (_pm),
# parts per million (_ppm). Qualitative basis: couriers can be killed, delayed or confused, flags and telegraph work
# where lines exist (CWV p511 section 4.7); orders were late or lost (CWV p116). Every number below is a placeholder
# awaiting the calibration target named on its row; no CWV page gives a speed or a loss rate.

schema = "command/1"

