# Battle-AI tables (SPEC-010 section 4): personality base and deltas, difficulty rows, globals.
# Units: ticks (_ticks), millimetres (_mm), permille (_pm). Ratios are own:enemy in permille (1500 = 1.5).
# Every number is a placeholder with a calibration target unless it cites a page. A trait delta takes its sign
# from the documented act in a commander record (act_from and sources); the magnitudes stay placeholders.

[base]
risk_tolerance = 500
reserve = 200
assault_ratio = 1500
withdraw_ratio = 600
entrench = 300
discretion = 400
reaction_ticks = 0
confidence = "unverified"
placeholder = true
calibration_target = "CT-010-4"
note = "Base personality of a commander with no documented traits."

[bounds]
share_max_pm = 1000
ratio_max_pm = 10000
reaction_max_ticks = 1000
confidence = "unverified"
placeholder = true
calibration_target = "CT-010-4"
note = "Clamp ranges: shares and discretion 0 to share_max_pm, the two ratios 0 to ratio_max_pm, reaction 0 to reaction_max_ticks."

