# Morale and cohesion table (SPEC-006 section 3). Per-training and symptom keys carry their unit
# in the name (_ppm parts per million, _pm permille). In [globals] a key without suffix is ppm,
# except the group from nbr_radius to flight_distance (millimetres) and the group from min_fall to
# dwell (ticks). The research pages give only qualitative claims: morale is a regiment property
# built from casualties, officer losses, supply, fatigue, terrain, neighbours breaking and flanking
# (CWV p511 section 4.6); raw regiments were wildly uneven (CWV p030 section 1.3). Every number is
# a placeholder awaiting calibration; the target of each row names the quantity that tunes it
# (CT-006-61 loss at the first fall back, 62 flank and rear, 63 rally time, 64 leader and cover,
# 65 symptoms before the break, 66 neighbours, 67 training ratio, 68 absence while broken).
schema = "morale/1"

[[training]]
id = "raw"
base_ppm = 800000
cap_pm = 355
up_pm = 30
rally_pm = 8
return_pm = 500
nbr_pm = 1500
confidence = "unverified"
placeholder = true
calibration_target = "CT-006-61"
sources = [{ document = "CWV", page = 30, note = "raw regiments wildly uneven, section 1.3" }]
note = "Lowest base and capacity, slowest recovery, strongest neighbour shock."

