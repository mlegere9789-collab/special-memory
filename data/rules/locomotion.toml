# Locomotion: gait speeds, fatigue drain, steering globals and the fatigue speed curve (SPEC-004 sections 3 and 4).
# Units: mm/s, ppm per tick, permille. Every row is a placeholder awaiting its calibration target.
schema = "locomotion/1"
tick_hz = 20

