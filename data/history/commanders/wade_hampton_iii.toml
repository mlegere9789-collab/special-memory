[[career]]
role = "Commander, Cavalry Corps"
from = "1864-08-11"

[career.fact]
value = "Lee gave him the Cavalry Corps on 1864-08-11 after Stuart's death; he won Trevilian Station and led the Beefsteak Raid in September 1864. Lieutenant general dated 1865-02-14."
confidence = "partial"
sources = [{document = "CWV", page = 299, tag = "[V]"}, {document = "CWV", page = 308, tag = "[V]"}]

