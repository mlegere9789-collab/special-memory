id = "wade_hampton_iii"
name = "Wade Hampton III"
side = "confederate"

[[career]]
role = "Cavalry brigade commander"

[career.fact]
value = "Raised Hampton's Legion at his own expense. His brigade fought at Brandy Station (1863-06-09), where he and Jones's and W.H.F. Lee's brigades drove the Union force off Fleetwood Hill; on 1863-07-03 he fought at East Cavalry Field and was badly wounded. Also wounded at First Manassas, Seven Pines and Brandy Station."
confidence = "partial"
