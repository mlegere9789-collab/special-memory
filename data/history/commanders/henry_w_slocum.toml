flag = "The six-hour claim on p272 sits against Meade arriving about midnight (p081) and Hancock sent by Meade to take overall tactical command at about 3:30 p.m. (p080); not resolved here."

[[career]]
role = "Wing commander"

[career.fact]
value = "Led the Army of Georgia (XIV and XX Corps) as Sherman's left wing on the March to the Sea; resigned September 1865; congressman 1869-73 and 1883-85."
