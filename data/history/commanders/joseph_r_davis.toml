[career.fact]
value = "The president's nephew. On 1863-07-01 his brigade attacked north of the Chambersburg Pike and was trapped in the unfinished railroad cut by the 6th Wisconsin and others, with hundreds captured; it was repulsed about 11 a.m. He was wounded, and the brigade was in the advance of 1863-07-03."
