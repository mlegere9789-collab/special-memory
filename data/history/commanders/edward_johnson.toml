[[career]]
role = "Division commander, Second Corps"

[career.fact]
value = "Led a division of Ewell's Second Corps. On 1863-06-15 it struck the retreating Winchester column at Stephenson's Depot; it reached Gettysburg late on 1863-07-01, attacked Culp's Hill on the evening of 1863-07-02, and renewed the attack about 4:30 a.m. on 1863-07-03, withdrawing by about 11 a.m."
confidence = "unverified"
sources = [{document = "CWV", page = 77, tag = "untagged"}, {document = "CWV", page = 78, tag = "untagged"}, {document = "CWV", page = 80, tag = "untagged"}, {document = "CWV", page = 82, tag = "untagged"}, {document = "CWV", page = 83, tag = "untagged"}, {document = "CWV", page = 310, tag = "[V/U]"}]
flag = "The pages disagree on the division's brigades. One page lists Steuart's, Jones's and Nicholls's/Walker's brigades; another names Daniel's, Steuart's and the Stonewall Brigade; another lists Steuart's, the Stonewall Brigade, Jones's brigade and Louisiana regiments; the brigade-level order of battle shows Daniel's brigade under Rodes. No roster is chosen."

[[career]]
