[career.fact]
value = "Colonel of the 13th Mississippi, brigadier from August 1862. His brigade held the Fredericksburg waterfront against bridge builders in December 1862 and formed a thin line at Marye's Heights in May 1863. On 1863-07-02 he rode at the head of the brigade at the Peach Orchard, was hit in the knee, foot and chest, and died on 1863-07-03 at the Hummelbaugh farm."
