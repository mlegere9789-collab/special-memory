[career.fact]
value = "Major general, dated back to 1863-05-02 on Jackson's recommendation. Led a division in the flank march and attack at Chancellorsville and briefly held the corps after Hill fell that night. In June 1863 he was sent to Berryville (action of 1863-06-13). On 1863-07-01 his division attacked from Oak Hill about 2 to 2:30 p.m.; the first attacks were poorly coordinated and costly, but he routed Robinson's division. Killed at Third Winchester on 1864-09-19 by a shell fragment."
