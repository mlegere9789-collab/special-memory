[career.fact]
value = "Major general from 1863-05-24. His division moved down the Chambersburg Pike on the morning of 1863-07-01 and met Buford's dismounted cavalry about 7:30 to 8 a.m., opening the battle; he was wounded that day (a bullet to the head was turned by a stuffed hat). His own account gives a search for shoes as the reason; the volume treats that as doubtful and describes a reconnaissance in force."
confidence = "partial"
sources = [{document = "CWV", page = 80, tag = "untagged"}, {document = "CWV", page = 309, tag = "[V]"}, {document = "CWV", page = 326, tag = "untagged"}]
flag = "Heth's own account (a search for shoes) conflicts with the reading of the move as a reconnaissance in force; the volume says the motive carries doubtful weight. No motive is chosen here."

