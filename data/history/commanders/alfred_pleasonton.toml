[[career]]
role = "Cavalry Corps commander"
from = "1863-05"

[career.fact]
value = "Hooker named him temporary replacement for Stoneman after Chancellorsville; he commanded the Cavalry Corps at Brandy Station and through the Gettysburg campaign."
