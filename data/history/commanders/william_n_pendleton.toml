[career.fact]
value = "Ordained Episcopal priest in 1838 and rector at Lexington from 1853; brigadier general from 1862-03-26. At Shepherdstown on 1862-09-19 he commanded the rear guard and reported all his guns lost, though only four were captured. In 1863 he headed the artillery overall, with the reserve organised into battalions under corps chiefs; his guns joined the pre-assault bombardment on 1863-07-03."
