[[career]]
role = "South Cavalry Field"
from = "1863-07-03"

[career.fact]
value = "Ordered Farnsworth's brigade to charge Longstreet's infantry behind a stone wall on 1863-07-03 over Farnsworth's reported objection; Farnsworth was killed leading the last group."
confidence = "partial"
sources = [{document = "CWV", page = 83, tag = "untagged"}, {document = "CWV", page = 278, tag = "[V]"}]

[[career]]
role = "Retreat and Dahlgren raid"
from = "1863-07-04"
to = "1864-03"

[career.fact]
value = "His cavalry attacked Ewell's wagon train at Monterey Pass on 1863-07-04 and 1863-07-05 and struck the Confederate rearguard at Falling Waters on 1863-07-14; his raid toward Richmond left Stevensburg on 1864-02-28 and Ulric Dahlgren's detached column was ambushed."
confidence = "partial"
sources = [{document = "CWV", page = 84, tag = "untagged"}, {document = "CWV", page = 278, tag = "[V]"}]

[[career]]
role = "Later career"
from = "1866"
to = "1881-12-04"

[career.fact]
value = "Took the 3rd Cavalry Division under Sherman in 1864; minister to Chile 1866-70 and again in 1881, dying in Santiago."
