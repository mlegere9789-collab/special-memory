# Every field the interface may show (SPEC-015 section 14, T15-02). `name` is `Struct.field`,
# `source` the simulation or information-model value it is read from, `kind` how it is shown:
# exact (the value itself), band (a quantisation printed in the tooltip) or range (brackets the
# truth). A field with no source is refused by tools/validate_ui.py.
