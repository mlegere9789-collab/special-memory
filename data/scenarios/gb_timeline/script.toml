# SPEC-011 section 7, timeline rows TL-01 to TL-15 (clock seconds since 00:00 on 1863-07-01).
# Row ids are the TL ids in lower case (`tl_06` is TL-06). Arrivals live in the SPEC-008 scenario
# (ADR 0010 D-06), so each arrival time is kept here as a marker trigger that fixes the logged tick.
# A trigger with `early_s` or `late_s` runs as three variants (nominal, early, late); the ledger time is
# `at_s` and the conflicting account is the other value (SPEC-011 section 4.5). Orders name units of the
# scenario's unit list; `hold` is the inert order kind until the scenario supplies objectives, so only
# the order time is evidence. Observation positions and unit ids wait for the SPEC-014 map and the
# SPEC-008 scenario; rows that need a position are placeholders.
schema = "replay-script/1"

[meta]
scenario = "gb_timeline"
fidelity_class = 2
clock_start_s = 0
end_s = 259200

[[trigger]]
id = "tl_01"
at_s = 37200
confidence = "unverified"
sources = [{ document = "CWV", page = 80, tag = "untagged" }]
note = "TL-01 arrival, I Corps lead."

